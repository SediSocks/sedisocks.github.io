    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* light by default, dark if the system prefers it */
        :root {
            color-scheme: light;
            --bg: #f7f7f7;
            --text: #000;
            --line: #d0d0d0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #161616;
                --text: #ececec;
                --line: #333;
            }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Barlow", sans-serif;
            font-size: 18px;
            font-weight: 400;
            font-style: normal;
            line-height: 1.6;
            text-align: center;
        }

        main { max-width: 100%; }

        /* hidden visually, still readable by screen readers */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }
        .tagline { margin: 0; }

        a {
            color: inherit;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.25em;
            text-decoration-color: rgba(128, 128, 128, 0.5);
            overflow-wrap: anywhere;
            transition: text-decoration-color 0.15s;
        }
        a:hover { text-decoration-color: currentColor; }

        .divider {
            width: min(360px, 80vw);
            margin: 28px auto;
            border: 0;
            border-top: 1px solid var(--line);
        }

        /* links */
        .links a { display: block; }
        .links .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0 8px;
        }

        /* email: reserve its line (same as line-height) so nothing shifts, then wipe in */
        #e { min-height: 1.6em; }
        #e a {
            display: inline-block;
            animation: wipe 0.4s linear both;
        }
        @keyframes wipe {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @media (prefers-reduced-motion: reduce) {
            #e a { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1 class="visually-hidden">sedisocks</h1>
            <p class="tagline">3d generalist<br>currently lighting cinematics @ rockstar</p>
        </header>

        <hr class="divider">

        <nav class="links" aria-label="Profiles">
            <!-- email gets added here by app.min.js -->
            <div id="e" data-x="1"></div>

            <!-- bot bait -->
            <div hidden>sedisocks@sedimentarysocks.com</div>

            <a href="https://www.artstation.com/sedisocks" target="_blank" rel="me noopener">artstation.com/sedisocks</a>
            <a href="https://www.youtube.com/@sedisocks" target="_blank" rel="me noopener">youtube.com/@sedisocks</a>
            <div class="row">
                <a href="https://twitter.com/sedisocks" target="_blank" rel="me noopener">twitter.com/sedisocks</a>
                <span aria-hidden="true">|</span>
                <a href="https://bsky.sedisocks.com" target="_blank" rel="me noopener">bsky.sedisocks.com</a>
            </div>
            <a href="https://www.youtube.com/watch?v=7QAwICGJNZs" target="_blank" rel="noopener">2021 lighting reel</a>
        </nav>
    </main>

    <script src="/assets/app.min.js" defer></script>
</body>
</html>
